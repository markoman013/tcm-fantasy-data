name: Fetch ESPN data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: node fetch_espn.mjs
      - name: Save data
        run: |
          git config user.name "espn-bot"
          git config user.email "espn-bot@users.noreply.github.com"
          git add data
          git commit -m "ESPN data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
