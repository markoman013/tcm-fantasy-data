name: Make a move
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "swap_test (harmless test) or add_drop"
        required: true
        default: "swap_test"
        type: choice
        options: [swap_test, add_drop]
      dry_run:
        description: "true = only show what it would do, false = really do it"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      swap_a:
        description: "swap_test: first player (name)"
        required: false
        default: "Anthony Black"
      swap_b:
        description: "swap_test: second player (name)"
        required: false
        default: "Ivica Zubac"
      add:
        description: "add_drop: player to add (name)"
        required: false
      drop:
        description: "add_drop: player to drop (name), leave empty for no drop"
        required: false
      after_tip_team:
        description: "add_drop: wait until this NBA team's game tips off, e.g. POR"
        required: false
      if_out:
        description: "add_drop: if this player is OUT, move him to IR instead of dropping"
        required: false
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the move
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          SWAP_A: ${{ inputs.swap_a }}
          SWAP_B: ${{ inputs.swap_b }}
          ADD: ${{ inputs.add }}
          DROP: ${{ inputs.drop }}
          AFTER_TIP_TEAM: ${{ inputs.after_tip_team }}
          IF_OUT: ${{ inputs.if_out }}
        run: node move.mjs
      - name: Save the log
        if: always()
        run: |
          git config user.name "espn-bot"
          git config user.email "espn-bot@users.noreply.github.com"
          git pull --rebase || true
          git add data/move_log.json
          git commit -m "Move log $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
