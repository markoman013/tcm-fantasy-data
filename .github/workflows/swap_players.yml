name: Swap players
run-name: "Swap players: ${{ inputs.starter }} / ${{ inputs.replacement }}"
on:
  workflow_dispatch:
    inputs:
      test_run:
        description: "Test run? Yes = only show what it would do, nothing changes. No = really do it"
        required: true
        default: "Yes"
        type: choice
        options: ["Yes", "No"]
      starter:
        description: "Player 1: the starter (full name, for example Scottie Barnes)"
        required: true
      replacement:
        description: "Player 2: the bench player who takes his slot (full name)"
        required: true
      only_if_out:
        description: "Only swap if Player 1 is really OUT? Yes = watch until just before tip-off, swap only if OUT, swap back if he is not. No = swap right now"
        required: true
        default: "No"
        type: choice
        options: ["No", "Yes"]
      swap_back:
        description: "Swap back right away? (Yes only for testing a plain swap, ignored when the answer above is Yes)"
        required: true
        default: "No"
        type: choice
        options: ["No", "Yes"]
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run it
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          MODE: swap
          TEST_RUN: ${{ inputs.test_run }}
          STARTER: ${{ inputs.starter }}
          REPLACEMENT: ${{ inputs.replacement }}
          ONLY_IF_OUT: ${{ inputs.only_if_out }}
          SWAP_BACK: ${{ inputs.swap_back }}
        run: node move.mjs
      - name: Save the log
        if: always()
        run: |
          git config user.name "espn-bot"
          git config user.email "espn-bot@users.noreply.github.com"
          git pull --rebase || true
          git add data/move_log.json
          git commit -m "Swap log $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
