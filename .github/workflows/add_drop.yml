name: Add or drop a player
run-name: "Add ${{ inputs.add }} / drop ${{ inputs.drop }}"
on:
  workflow_dispatch:
    inputs:
      test_run:
        description: "Test run? Yes = only show what it would do, nothing changes. No = really do it"
        required: true
        default: "Yes"
        type: choice
        options: ["Yes", "No"]
      add:
        description: "Player to add (full name, for example Wendell Carter)"
        required: true
      drop:
        description: "Player to drop (full name). Leave empty to add without dropping"
        required: false
      after_tip_team:
        description: "Wait until this NBA team's game tips off first (team code, for example POR). Leave empty to do it right away"
        required: false
      if_out:
        description: "Optional: if this player is OUT, move him to an open IR slot instead of dropping anyone (full name)"
        required: false
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run it
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          MODE: add_drop
          TEST_RUN: ${{ inputs.test_run }}
          ADD: ${{ inputs.add }}
          DROP: ${{ inputs.drop }}
          AFTER_TIP_TEAM: ${{ inputs.after_tip_team }}
          IF_OUT: ${{ inputs.if_out }}
        run: node move.mjs
      - name: Save the log
        if: always()
        run: |
          git config user.name "espn-bot"
          git config user.email "espn-bot@users.noreply.github.com"
          git pull --rebase || true
          git add data/move_log.json
          git commit -m "Add/drop log $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
